<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="50%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#080D17"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B111E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="320" cy="155" r="145" fill="url(#amberGlow)"/>
  <!-- Decorative Crossed Cutlasses / Stars subtle background -->
  <circle cx="320" cy="155" r="75" fill="#131D2E" stroke="#22324D" stroke-width="2"/>
  <!-- Pirate Hat & Crown Iconography -->
  <path d="M 235 170 C 255 125, 385 125, 405 170 C 420 195, 320 215, 235 170 Z" fill="url(#goldGradient)"/>
  <circle cx="320" cy="168" r="32" fill="#0B111E" stroke="url(#goldGradient)" stroke-width="3.5"/>
  <!-- Skull Details -->
  <circle cx="310" cy="164" r="6" fill="#FBBF24"/>
  <circle cx="330" cy="164" r="6" fill="#FBBF24"/>
  <path d="M 314 182 L 326 182" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <!-- Headline Typography -->
  <text x="320" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="4">SKULL KING</text>
  <text x="320" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" text-anchor="middle" letter-spacing="3">TRICK-TAKING PIRATE BATTLES</text>
</svg>
