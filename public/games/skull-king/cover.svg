      <stop offset="0%" stop-color="#0e1719"/>
      <stop offset="50%" stop-color="#142429"/>
      <stop offset="100%" stop-color="#0a1012"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="140" fill="url(#goldGlow)"/>
  <!-- Pirate Hat & Crown Iconography -->
  <path d="M 240 180 C 260 140, 380 140, 400 180 C 420 200, 320 220, 240 180 Z" fill="#d4af37" opacity="0.8"/>
  <circle cx="320" cy="175" r="32" fill="#121619" stroke="#d4af37" stroke-width="4"/>
  <!-- Skull Eyes -->
