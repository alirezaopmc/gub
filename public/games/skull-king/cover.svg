  <text x="320" y="275" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#d4af37" text-anchor="middle" letter-spacing="4">SKULL KING</text>
  <text x="320" y="305" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#a8a29e" text-anchor="middle" letter-spacing="2">TRICK-TAKING PIRATE BATTLES</text>
