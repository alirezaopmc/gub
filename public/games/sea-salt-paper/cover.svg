<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="seaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="oceanGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#seaBg)"/>
  <circle cx="320" cy="150" r="140" fill="url(#oceanGlow)"/>
  
  <!-- Origami Wave & Boat Motif -->
  <g transform="translate(320, 150)">
    <!-- Origami Boat Hull -->
    <polygon points="-50,20 50,20 30,45 -30,45" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
    <!-- Origami Sails -->
    <polygon points="-5,15 -5,-40 -40,15" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="5,15 5,-30 35,15" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/>
    <!-- Fold lines -->
    <line x1="-5" y1="15" x2="-20" y2="-10" stroke="#7dd3fc" stroke-width="1.5"/>
    <line x1="5" y1="15" x2="20" y2="-5" stroke="#7dd3fc" stroke-width="1.5"/>
  </g>
  
  <!-- Ocean Swell lines -->
  <path d="M 120 230 Q 180 215 240 230 T 360 230 T 480 230 T 540 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 160 245 Q 220 235 280 245 T 400 245 T 500 245" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.4"/>

  <text x="320" y="278" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#f0f9ff" text-anchor="middle" letter-spacing="4">SEA SALT &amp; PAPER</text>
  <text x="320" y="306" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">ORIGAMI CARD GAME COMPANION</text>
</svg>
