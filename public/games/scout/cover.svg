<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="scoutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#scoutBg)"/>
  <circle cx="320" cy="150" r="140" fill="url(#neonGlow)"/>
  <!-- Card Fan Graphic (Scout theme) -->
  <g transform="translate(320, 155)">
    <!-- Card 1 -->
    <rect x="-85" y="-60" width="46" height="72" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" transform="rotate(-18)"/>
    <text x="-65" y="-20" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" transform="rotate(-18)">3</text>
    <!-- Card 2 -->
    <rect x="-45" y="-68" width="46" height="72" rx="6" fill="#e11d48" stroke="#fb7185" stroke-width="2" transform="rotate(-6)"/>
    <text x="-22" y="-28" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" transform="rotate(-6)">4</text>
    <!-- Card 3 -->
    <rect x="-1" y="-68" width="46" height="72" rx="6" fill="#16a34a" stroke="#4ade80" stroke-width="2" transform="rotate(6)"/>
    <text x="22" y="-28" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" transform="rotate(6)">5</text>
    <!-- Card 4 -->
    <rect x="39" y="-60" width="46" height="72" rx="6" fill="#d97706" stroke="#fcd34d" stroke-width="2" transform="rotate(18)"/>
    <text x="65" y="-20" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" transform="rotate(18)">6</text>
  </g>
  <text x="320" y="275" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" text-anchor="middle" letter-spacing="6">SCOUT</text>
  <text x="320" y="305" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#a8a29e" text-anchor="middle" letter-spacing="2">LADDER CLIMBING &amp; SHOW COMPANION</text>
</svg>
