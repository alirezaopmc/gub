name: CI

# Dev stage (ADR-076): CI runs only on release and Renovate pull requests and manual runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Go Server
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') || startsWith(github.head_ref, 'changeset-release/') || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum

      - name: Go build
        run: go -C server build ./...

      - name: Go vet
        run: go -C server vet ./...

      - name: Go test with race detector
        run: go -C server test -race ./...

  frontend:
    name: Frontend
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') || startsWith(github.head_ref, 'changeset-release/') || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile
      # Golden vectors are committed after export and biome formatting. The export
      # itself writes raw JSON, so the formatter runs before the diff check.
      - run: bun run export:golden-vectors
      - run: bunx biome format --write testdata
      - run: git diff --exit-code -- testdata
      # ponytail: full-repo lint still has legacy debt; lint only the docs path until follow-up
      - run: bunx biome check src/lib/docs
      - run: bun run test:run
      - run: bun run build
